# Ruflet Explorer can preview any application, so direct template builds enable
# every protected native capability. Generated applications still use the
# developer project's root services.yaml and request only selected permissions.
services:
  - camera:
      description: Allow Ruflet apps to capture photos and video.
  - microphone:
      description: Allow Ruflet apps to record audio.
  - location:
      description: Allow Ruflet apps to use the device location.
  - motion:
      description: Allow Ruflet apps to use motion sensors.
