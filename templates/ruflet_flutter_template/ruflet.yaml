# Ruflet Explorer is the universal preview client, so direct template builds
# bundle every optional extension. Generated applications still use the
# developer project's root ruflet.yaml and remain pruned to that selection.
# Core controls and services (including clipboard, file picker, screenshot,
# sensors, and SpinKit) are registered by the client and need no entry here.
extensions:
  - audio
  - audio_recorder
  - camera
  - charts
  - code_editor
  - color_pickers
  - datatable2
  - flashlight
  - geolocator
  - lottie
  - map
  - permission_handler
  - rive
  - secure_storage
  - video
  - webview
