app:
  name: ruflet_client
  display_name: Ruflet Client

# The reusable connection client intentionally supports the complete extension
# catalog. Per-app builds are pruned to the developer project's selection.
extensions:
  - ads
  - audio
  - audio_recorder
  - camera
  - charts
  - code_editor
  - color_pickers
  - datatable2
  - flashlight
  - geolocator
  - lottie
  - map
  - permission_handler
  - rive
  - secure_storage
  - video
  - webview
