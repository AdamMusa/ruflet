app:
  name: ruflet_client
  display_name: Ruflet Explorer

# Ruflet Explorer is the universal preview client, so it intentionally bundles
# the complete optional extension catalog. Core controls and services (including
# clipboard, file picker, screenshot, sensors, and SpinKit) need no entry here.
# Per-app builds remain pruned to the developer project's selection.
extensions:
  - audio
  - audio_recorder
  - camera
  - charts
  - code_editor
  - color_pickers
  - datatable2
  - flashlight
  - geolocator
  - lottie
  - map
  - permission_handler
  - qrcode_scanner
  - rive
  - secure_storage
  - video
  - webview
