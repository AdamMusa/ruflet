name: Test Ruflet Explorer Desktop Builds

# Smoke test for self-contained desktop builds: proves the embedded Ruby VM is
# packaged and linked correctly on Linux and Windows. Ruflet Explorer is the app
# under test because it is the client we ship.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-ruflet-explorer-desktop.yml"
      - "packages/ruflet/**"
      - "packages/ruflet_core/**"
      - "packages/ruflet_server/**"
      - "ruby_runtime/**"
  push:
    paths:
      - ".github/workflows/test-ruflet-explorer-desktop.yml"
      - "packages/ruflet/**"
      - "packages/ruflet_core/**"
      - "packages/ruflet_server/**"
      - "ruby_runtime/**"

permissions:
  contents: read

jobs:
  build-explorer:
    name: Ruflet Explorer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest

    steps:
      - name: Checkout Ruflet
        uses: actions/checkout@v4

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v4
        with:
          repository: AdamMusa/ruflet_explorer
          path: explorer

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Use the checked-out Ruflet gems
        shell: bash
        run: |
          ruby -e 'root = ENV.fetch("GITHUB_WORKSPACE").tr("\\", "/"); File.write("explorer/Gemfile", <<~GEMFILE)
          source "https://rubygems.org"

          gem "ruflet", path: "#{root}/packages/ruflet"
          gem "ruflet_core", path: "#{root}/packages/ruflet_core"
          gem "ruflet_server", path: "#{root}/packages/ruflet_server"
          GEMFILE
          '

      - name: Install Ruflet Explorer gems
        working-directory: explorer
        run: bundle install

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build self-contained Ruflet Explorer on Linux
        if: matrix.target == 'linux'
        working-directory: explorer
        env:
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruby_runtime
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec ruflet build linux --self

      - name: Build self-contained Ruflet Explorer on Windows
        if: matrix.target == 'windows'
        working-directory: explorer
        shell: pwsh
        env:
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruby_runtime
        run: |
          bundle exec ruflet build windows --self 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content windows-build.log -Tail 30) -join "%0A"
            Write-Host "::error title=Ruflet Explorer Windows build failed::$tail"
            exit $buildExitCode
          }

      # The executable takes the app's own package name, so discover it rather
      # than hardcoding one and silently passing against the wrong binary.
      - name: Verify Linux distribution
        if: matrix.target == 'linux'
        shell: bash
        run: |
          bundle="explorer/build/client/build/linux/x64/release/bundle"
          test -d "$bundle" || { echo "No Linux bundle at $bundle"; exit 1; }

          exe=$(find "$bundle" -maxdepth 1 -type f -perm -u+x | head -n 1)
          test -n "$exe" || { echo "No executable in $bundle"; exit 1; }
          echo "Executable: $exe"

          test -f "$bundle/lib/libruflet_vm.so" || { echo "Missing packaged Ruflet VM"; exit 1; }
          ! ldd "$bundle/lib/libruflet_vm.so" | grep "not found"

      - name: Verify Windows distribution
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundle = "explorer/build/client/build/windows/x64/runner/Release"
          if (!(Test-Path $bundle)) { throw "No Windows release output at $bundle" }

          $exe = Get-ChildItem -Path $bundle -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No executable in $bundle" }
          Write-Host "Executable: $($exe.Name)"

          if (!(Test-Path "$bundle/ruflet_vm.dll")) {
            throw "Missing packaged Ruflet VM DLL"
          }

      - name: Refuse a bundle carrying credentials
        shell: bash
        run: |
          found=$(find explorer/build/client/build -type d -name credentials -o -type f \
            \( -name '*.p8' -o -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \) 2>/dev/null)
          if [ -n "$found" ]; then
            echo "The desktop bundle embeds credential material:"
            echo "$found"
            exit 1
          fi

      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: ruflet-explorer-${{ matrix.target }}
          path: |
            explorer/build/client/build/linux/x64/release/bundle
            explorer/build/client/build/windows/x64/runner/Release
          if-no-files-found: error
