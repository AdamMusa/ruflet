name: Build Ruflet Client Prebuilds

# The preview client shipped by `ruflet run` is Ruflet Explorer, built through
# the Ruflet CLI rather than a bare `flutter build`, so the published binaries
# are exactly what a user gets locally.
#
# Desktop and web are built server-driven: those clients are told which server
# to use at launch (desktop from the launcher's argument, web from the origin it
# is served from), so no backend can be baked in. Mobile is built self-contained
# because there the client is Explorer itself — its launcher, QR scanner and
# bundled Studio are Ruby and need the embedded VM.

on:
  workflow_dispatch:
    inputs:
      explorer_ref:
        description: Ruflet Explorer ref to build
        required: false
        default: main
  release:
    types: [published]
  push:
    branches: [main, prebuild, experimental]
    tags: ['v*']
    paths:
      - '.github/workflows/build-ruflet-client.yml'
      - 'packages/**'
      - 'ruby_runtime/**'
  pull_request:
    paths:
      - '.github/workflows/build-ruflet-client.yml'
      - 'packages/**'
      - 'ruby_runtime/**'

permissions:
  contents: write

concurrency:
  group: ruflet-client-prebuild-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPLORER_REPOSITORY: AdamMusa/ruflet_explorer
  EXPLORER_REF: ${{ github.event.inputs.explorer_ref || 'main' }}
  EXPERIMENTAL_TEMPLATE_REF: experimental
  EXPERIMENTAL_FLUTTER_VERSION: 3.41.2

jobs:
  verify-explorer:
    name: Verify Ruflet Explorer
    # macOS: parts of the CLI branch on the host being darwin — the Apple pod
    # shim and the install platform it infers — so the suites assume a macOS
    # host and fail on Linux for reasons unrelated to the code under test.
    runs-on: macos-latest
    steps:
      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          path: ruflet

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.EXPLORER_REPOSITORY }}
          ref: ${{ env.EXPLORER_REF }}
          path: explorer

      - name: Checkout Ruflet template
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet-template
          ref: ${{ github.ref_name == 'experimental' && env.EXPERIMENTAL_TEMPLATE_REF || 'main' }}
          path: ruflet-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run framework tests
        working-directory: ruflet
        env:
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
        run: |
          # One process per file. ruflet/hot_reload requires ruflet_core, whose
          # Kernel#method_missing turns any missing-method call in the process
          # into a control object — including inside Process::Waiter threads.
          # Loading every file together made that leak across suites, failing
          # unrelated tests depending on the random seed.
          for package in packages/ruflet packages/ruflet_core packages/ruflet_server; do
            echo "== $package =="
            (cd "$package" && for file in test/*_test.rb; do ruby -Ilib -Itest "$file"; done)
          done

      - name: Run Explorer tests
        if: github.ref_name != 'experimental'
        working-directory: explorer
        env:
          RUBYLIB: ${{ github.workspace }}/ruflet/packages/ruflet_core/lib:${{ github.workspace }}/ruflet/packages/ruflet_server/lib:${{ github.workspace }}/ruflet/packages/ruflet/lib
        run: |
          ruby test/url_test.rb
          ruby test/app_test.rb
          ruby test/standalone_apps_test.rb

      # Explorer main still asserts the legacy nested FletApp wire name in two
      # app-level tests. The experimental runtime intentionally speaks the
      # canonical RufletApp wire contract, which is covered by the framework
      # suite above. Keep the renderer-independent Explorer checks here until
      # Explorer main adopts that contract; do not weaken the runtime back to
      # the legacy alias merely to satisfy stale assertions.
      - name: Run experimental Explorer compatibility tests
        if: github.ref_name == 'experimental'
        working-directory: explorer
        env:
          RUBYLIB: ${{ github.workspace }}/ruflet/packages/ruflet_core/lib:${{ github.workspace }}/ruflet/packages/ruflet_server/lib:${{ github.workspace }}/ruflet/packages/ruflet/lib
        run: |
          ruby test/url_test.rb
          ruby test/standalone_apps_test.rb

      - name: Refuse to publish a client carrying credentials
        working-directory: explorer
        run: |
          found=$(find . -path ./build -prune -o \
            \( -name '*.p8' -o -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \
               -o -name '*.mobileprovision' -o -name '.env' \) -print)
          if [ -n "$found" ]; then
            echo "Credentials present in the checkout:"
            echo "$found"
            exit 1
          fi

  build-desktop-and-web:
    name: Build ${{ matrix.target }}
    needs: verify-explorer
    if: github.ref_name != 'experimental'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-latest
            artifact: ruflet_explorer-web.tar.gz
          - target: linux
            runner: ubuntu-latest
            artifact: ruflet_explorer-linux-x64.tar.gz
          - target: windows
            runner: windows-latest
            artifact: ruflet_explorer-windows-x64.zip
          - target: macos
            runner: macos-latest
            artifact: ruflet_explorer-macos-universal.zip

    steps:
      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          path: ruflet

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.EXPLORER_REPOSITORY }}
          ref: ${{ env.EXPLORER_REF }}
          path: explorer

      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev \
            libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Checkout Ruflet template
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet-template
          path: ruflet-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Server-driven: the client resolves its backend at launch, so no
      # backend_url is baked in and one binary works against any port.
      - name: Build ${{ matrix.target }} client
        working-directory: explorer
        shell: bash
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruflet/ruby_runtime
        run: ../ruflet/packages/ruflet/bin/ruflet build ${{ matrix.target }} --verbose

      - name: Package web artifact
        if: matrix.target == 'web'
        run: tar -C explorer/build/client/build/web -czf ruflet_explorer-web.tar.gz .

      - name: Package linux artifact
        if: matrix.target == 'linux'
        run: tar -C explorer/build/client/build/linux/x64/release/bundle -czf ruflet_explorer-linux-x64.tar.gz .

      - name: Package macos artifact
        if: matrix.target == 'macos'
        run: |
          app=$(find explorer/build/client/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "No .app produced under explorer/build/client/build/macos"
            exit 1
          fi
          echo "Packaging $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" ruflet_explorer-macos-universal.zip

      - name: Package windows artifact
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $release = "explorer/build/client/build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) { throw "No Windows release output at $release" }
          Compress-Archive -Path "$release/*" -DestinationPath ruflet_explorer-windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruflet_explorer-${{ matrix.target }}
          path: ${{ matrix.artifact }}

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

      - name: Publish prebuild channel release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prebuild'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'prebuild' && 'prebuild' || 'prebuild-main' }}
          name: ${{ github.ref_name == 'prebuild' && 'Ruflet Explorer Prebuild (prebuild)' || 'Ruflet Explorer Prebuild (main)' }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ matrix.artifact }}

      - name: Publish versioned client release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ruflet Explorer ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ matrix.artifact }}

  build-android:
    name: Build Android
    needs: verify-explorer
    if: github.ref_name != 'experimental'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          path: ruflet

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.EXPLORER_REPOSITORY }}
          ref: ${{ env.EXPLORER_REF }}
          path: explorer

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Ruflet template
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet-template
          path: ruflet-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Self-contained: on mobile the client is Explorer itself, so the Ruby
      # launcher, QR scanner and bundled Studio ship inside the app.
      - name: Build Android APK
        working-directory: explorer
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruflet/ruby_runtime
        run: ../ruflet/packages/ruflet/bin/ruflet build android --self --verbose

      - name: Build Android App Bundle
        working-directory: explorer
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruflet/ruby_runtime
        run: ../ruflet/packages/ruflet/bin/ruflet build aab --self --verbose

      - name: Package Android artifacts
        run: |
          apk=$(find explorer/build -name 'app-release.apk' | head -n 1)
          aab=$(find explorer/build -name 'app-release.aab' | head -n 1)
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "Missing Android outputs (apk=$apk aab=$aab)"
            exit 1
          fi
          cp "$apk" ruflet_explorer-android-apk.apk
          cp "$aab" ruflet_explorer-android-appbundle.aab

      - name: Verify no credentials were embedded
        run: |
          if unzip -l ruflet_explorer-android-apk.apk | grep -Ei '\.(p8|p12|jks|keystore|mobileprovision)$|/credentials/'; then
            echo "The APK embeds credential material."
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ruflet_explorer-android
          path: |
            ruflet_explorer-android-apk.apk
            ruflet_explorer-android-appbundle.aab

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ruflet_explorer-android-apk.apk
            ruflet_explorer-android-appbundle.aab

      - name: Publish Android to prebuild channel
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prebuild'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'prebuild' && 'prebuild' || 'prebuild-main' }}
          name: ${{ github.ref_name == 'prebuild' && 'Ruflet Explorer Prebuild (prebuild)' || 'Ruflet Explorer Prebuild (main)' }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            ruflet_explorer-android-apk.apk
            ruflet_explorer-android-appbundle.aab

  build-ios-simulator:
    name: Build iOS Simulator
    needs: verify-explorer
    if: github.ref_name != 'experimental'
    runs-on: macos-latest

    steps:
      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          path: ruflet

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.EXPLORER_REPOSITORY }}
          ref: ${{ env.EXPLORER_REF }}
          path: explorer

      - name: Checkout Ruflet template
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet-template
          path: ruflet-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS simulator client
        working-directory: explorer
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruflet/ruby_runtime
        run: ../ruflet/packages/ruflet/bin/ruflet build ios --self --simulator --verbose

      - name: Package iOS simulator artifact
        run: |
          app=explorer/build/client/build/ios/iphonesimulator/Runner.app
          if [ ! -d "$app" ]; then
            echo "No simulator .app produced"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" ruflet_explorer-ios-simulator.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruflet_explorer-ios-simulator
          path: ruflet_explorer-ios-simulator.zip

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ruflet_explorer-ios-simulator.zip

      - name: Publish iOS simulator to prebuild channel
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prebuild'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'prebuild' && 'prebuild' || 'prebuild-main' }}
          name: ${{ github.ref_name == 'prebuild' && 'Ruflet Explorer Prebuild (prebuild)' || 'Ruflet Explorer Prebuild (main)' }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ruflet_explorer-ios-simulator.zip

  build-experimental-apple:
    name: Build experimental ${{ matrix.target }}
    needs: verify-explorer
    if: github.ref_name == 'experimental' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            build_args: macos --exp --verbose
            artifact: ruflet_explorer-macos-experimental-universal.zip
          - target: ios
            build_args: ios --self --exp --simulator --verbose
            artifact: ruflet_explorer-ios-experimental-simulator.zip

    steps:
      - name: Checkout ruflet
        uses: actions/checkout@v5
        with:
          path: ruflet

      - name: Checkout Ruflet Explorer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.EXPLORER_REPOSITORY }}
          ref: ${{ env.EXPLORER_REF }}
          path: explorer

      - name: Checkout Ruflet template
        uses: actions/checkout@v5
        with:
          repository: AdamMusa/ruflet-template
          ref: ${{ env.EXPERIMENTAL_TEMPLATE_REF }}
          path: ruflet-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.EXPERIMENTAL_FLUTTER_VERSION }}
          cache: true

      - name: Verify authoritative Apple renderer
        working-directory: ruflet-template
        run: |
          git merge-base --is-ancestor c1fd2941c59f72af329a87580eab12f8c527ac81 HEAD
          test -f templates/ruflet_flutter_template/apple_packages/ruflet_apple/Package.swift
          test -f templates/ruflet_flutter_template/apple_packages/ruflet_apple/Sources/RufletEngine/RufletApp.swift
          test -f templates/ruflet_flutter_template/flutter_hosts/ios/Runner/AppDelegate.swift
          test -f templates/ruflet_flutter_template/flutter_hosts/macos/Runner/MainFlutterWindow.swift

      - name: Build experimental ${{ matrix.target }} client
        working-directory: explorer
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          RUFLET_TEMPLATE_ROOT: ${{ github.workspace }}/ruflet-template
          RUFLET_RUBY_RUNTIME_PATH: ${{ github.workspace }}/ruflet/ruby_runtime
        run: ../ruflet/packages/ruflet/bin/ruflet build ${{ matrix.build_args }}

      - name: Package experimental macOS artifact
        if: matrix.target == 'macos'
        run: |
          app=$(find explorer/build/client/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "No experimental macOS .app produced"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.artifact }}"

      - name: Package experimental iOS simulator artifact
        if: matrix.target == 'ios'
        run: |
          app=explorer/build/client/build/ios/iphonesimulator/Runner.app
          if [ ! -d "$app" ]; then
            echo "No experimental iOS simulator .app produced"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.artifact }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ruflet_explorer-${{ matrix.target }}-experimental
          path: ${{ matrix.artifact }}

      - name: Publish experimental branch Apple prebuild
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuild-experimental
          name: Ruflet Explorer Prebuild (experimental)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ matrix.artifact }}

  publish-prebuild-manifest:
    name: Publish completed prebuild revision
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prebuild'))) &&
      needs.build-desktop-and-web.result == 'success' &&
      needs.build-ios-simulator.result == 'success' &&
      needs.build-android.result == 'success'
    needs:
      - build-desktop-and-web
      - build-ios-simulator
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Write completed-build manifest
        env:
          RUFLET_REVISION: ${{ github.sha }}
          RUFLET_RUN_ID: ${{ github.run_id }}
          RUFLET_REF: ${{ github.ref_name }}
          RUFLET_EXPLORER_REF: ${{ env.EXPLORER_REF }}
        run: |
          ruby -rjson -rtime -e 'File.write("ruflet_explorer-manifest.json", JSON.pretty_generate({schema: 1, revision: ENV.fetch("RUFLET_REVISION"), run_id: ENV.fetch("RUFLET_RUN_ID"), ref: ENV.fetch("RUFLET_REF"), explorer_ref: ENV.fetch("RUFLET_EXPLORER_REF"), completed_at: Time.now.utc.iso8601}))'

      - name: Upload completed-build manifest
        uses: actions/upload-artifact@v5
        with:
          name: ruflet-client-prebuild-manifest
          path: ruflet_explorer-manifest.json

      - name: Mark prebuild channel complete
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'prebuild' && 'prebuild' || 'prebuild-main' }}
          name: ${{ github.ref_name == 'prebuild' && 'Ruflet Explorer Prebuild (prebuild)' || 'Ruflet Explorer Prebuild (main)' }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ruflet_explorer-manifest.json

  publish-experimental-prebuild-manifest:
    name: Publish completed experimental prebuild revision
    if: >-
      github.ref_name == 'experimental' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      needs.build-experimental-apple.result == 'success'
    needs:
      - build-experimental-apple
    runs-on: ubuntu-latest
    steps:
      - name: Write completed experimental build manifest
        env:
          RUFLET_REVISION: ${{ github.sha }}
          RUFLET_RUN_ID: ${{ github.run_id }}
          RUFLET_REF: ${{ github.ref_name }}
          RUFLET_EXPLORER_REF: ${{ env.EXPLORER_REF }}
        run: |
          ruby -rjson -rtime -e 'File.write("ruflet_explorer-manifest.json", JSON.pretty_generate({schema: 1, revision: ENV.fetch("RUFLET_REVISION"), run_id: ENV.fetch("RUFLET_RUN_ID"), ref: ENV.fetch("RUFLET_REF"), explorer_ref: ENV.fetch("RUFLET_EXPLORER_REF"), completed_at: Time.now.utc.iso8601}))'

      - name: Upload completed experimental manifest
        uses: actions/upload-artifact@v5
        with:
          name: ruflet-client-experimental-prebuild-manifest
          path: ruflet_explorer-manifest.json

      - name: Mark experimental prebuild channel complete
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuild-experimental
          name: Ruflet Explorer Prebuild (experimental)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ruflet_explorer-manifest.json
